name: Atom Harness V2 CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: atom-harness-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify V2 on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-harness.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tooling/svelte-validator/package-lock.json

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          rustup default 1.96.0

      - name: Check Python format and lint
        run: |
          python -m ruff format --check atom_llm_protocol.py atom_llm_provider.py atom_provider_fabric.py atom_run_transaction.py atom_harness_knowledge.py atom_harness_runtime.py atom_harness_experiment.py atom_harness_side_view.py tests/test_atom_language_harness_integration.py tests/test_atom_language_harness_v2_integration.py tests/test_atom_provider_protocol_v2.py tests/test_atom_causal_live_integration.py scripts/verify_atom_harness_v2.py
          python -m ruff check atom_llm_protocol.py atom_llm_provider.py atom_provider_fabric.py atom_run_transaction.py atom_harness_knowledge.py atom_harness_runtime.py atom_harness_experiment.py atom_harness_side_view.py tests/test_atom_language_harness_integration.py tests/test_atom_language_harness_v2_integration.py tests/test_atom_provider_protocol_v2.py tests/test_atom_causal_live_integration.py scripts/verify_atom_harness_v2.py

      - name: Compile Python entrypoints
        run: python -m py_compile atom_llm_protocol.py atom_llm_provider.py atom_provider_fabric.py atom_run_transaction.py atom_harness_knowledge.py atom_harness_runtime.py atom_harness_experiment.py atom_harness_side_view.py scripts/verify_atom_harness_v2.py

      - name: Parse PowerShell launcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./run-atom-harness.ps1),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Enforce repository policy
        run: python scripts/verify_atom_harness_v2.py

      - name: Run harness integration suites
        run: |
          python -m unittest discover -s tests -p "test_atom_language_harness_v2_integration.py" -v
          python -m unittest discover -s tests -p "test_atom_provider_protocol_v2.py" -v
          python -m unittest discover -s tests -p "test_atom_language_harness_integration.py" -v
          python -m unittest discover -s tests -p "test_atom_causal_live_integration.py" -v

      - name: Install lockfile-pinned frontend validator
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/svelte-validator

      - name: Run full Python regression suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run privacy-blocked launcher end to end
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'atom-harness-v2-privacy'
          ./run-atom-harness.ps1 `
            -Provider openrouter `
            -Question 'Prove that cloud evidence remains blocked by default.' `
            -OutputDir $output
          python -c "import json, pathlib; from atom_run_transaction import verify_committed_run; p=pathlib.Path(r'$output'); a=json.loads((p/'atom_harness_artifact.json').read_text(encoding='utf-8')); verify_committed_run(p); assert a['passed'] and a['degraded'] and a['outcome']=='degraded-abstention'; assert a['provider_routes'][0]['attempts'][0]['failure_kind']=='privacy'; assert (p/'atom_harness_side_view.html').is_file()"

      - name: Check Rust formatting
        run: cargo fmt --manifest-path atom_causal_memory_rust/Cargo.toml --all -- --check

      - name: Lint Rust with warnings denied
        run: cargo clippy --manifest-path atom_causal_memory_rust/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust workspace
        run: cargo test --manifest-path atom_causal_memory_rust/Cargo.toml --workspace --all-targets
